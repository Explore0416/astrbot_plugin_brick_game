name: astrbot_plugin_brick_game
display_name: 砖厂游戏
short_desc: QQ 群签到、烧砖、拍人，积分可兑换 Xiaoning-API 余额/重置卡
desc: |
  NapCat / OneBot v11 群聊小游戏，包含签到积分、群友助力烧砖、消耗砖块禁言群友，
  以及通过 Xiaoning-API 访问令牌把签到积分兑换为账号余额或重置卡。

  - 签到：每人每天限一次，获得积分并记录在服务器
  - 烧砖：烧砖后，群内其他成员累计发送指定条数消息即可烧成一块砖
  - 拍人：消耗自己的一块砖，将指定群友禁言一段时间
  - 每人最多同时拥有 3 块砖（可用砖块与正在烧的砖合计）
  - 积分兑换：管理员可设置仅余额、仅重置卡或两者；可配置积分比例、每日/每月限额
  - 兑换前用户使用“绑定账号 <用户ID>”绑定 Xiaoning-API 账号，管理员也可设置统一兑换账号
  - 指令直接匹配，触发时优先于 AI 回复，不会继续调用大模型
  - 数据保存在 data/plugin_data/astrbot_plugin_brick_game/state.json
version: 1.1.1
